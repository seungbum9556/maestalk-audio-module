[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maestalk-audio"
version = "0.4.1"
description = "Offline instrument pitch, relative level and Chroma analysis for Maestalk"
readme = "MODULE_README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4", "scipy==1.15.3", "librosa==0.11.0",
  "soundfile==0.14.0", "onnxruntime==1.23.2", "soxr==1.1.0",
  "torch==2.5.1", "torchaudio==2.5.1", "einops==0.8.2",
  "local-attention==1.9.15", "rotary-embedding-torch==0.9.2",
]

[project.optional-dependencies]
plot = ["matplotlib==3.10.9"]
score = ["mido==1.3.3"]

[project.scripts]
maestalk-audio = "maestalk_audio.__main__:main"

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md", "maestalk_audio/_vendor/*/LICENSE"]

[tool.setuptools.packages.find]
include = ["maestalk_audio*"]

[tool.setuptools.package-data]
maestalk_audio = ["assets/*.json", "assets/*.onnx", "assets/*.pt", "_vendor/*/LICENSE"]
